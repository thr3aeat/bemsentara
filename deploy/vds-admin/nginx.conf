# http://<VDS IP>/ → VDS durum paneli. Alan adı istekleri (ekoyildiz.duckdns.org) kendi server bloğunda kalır.
# Kurulum: cp deploy/vds-admin/nginx.conf /etc/nginx/sites-available/vds-admin
#          ln -s /etc/nginx/sites-available/vds-admin /etc/nginx/sites-enabled/vds-admin && nginx -t && systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
